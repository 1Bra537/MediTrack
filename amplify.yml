version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - cd Frontend
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: Frontend/.next
        files:
          - '**/*'
      cache:
        paths:
          - Frontend/.next/cache/**/*
          - Frontend/node_modules/**/*
